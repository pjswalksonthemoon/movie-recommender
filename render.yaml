services:
  - type: web
    name: reelwise-movie-recommender
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: python -m pip install -r requirements.txt && python -m app.download_data
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/movies/popular
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
